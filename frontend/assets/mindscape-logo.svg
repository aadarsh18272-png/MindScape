<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" role="img" aria-labelledby="title">
  <title id="title">Mindscape</title>
  <defs><linearGradient id="mark" x1="5" y1="5" x2="55" y2="55" gradientUnits="userSpaceOnUse"><stop stop-color="#FF927D"/><stop offset="1" stop-color="#9A7BCE"/></linearGradient></defs>
  <g id="symbol" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <path pathLength="1" class="draw" d="M30 5C16.2 5 5 15.6 5 28.5c0 7.6 4.1 14.2 10.5 17.8V55l9-4.4c1.8.5 3.6.7 5.5.7 13.8 0 25-10.4 25-23.3S43.8 5 30 5Z" stroke-width="2.5"/>
    <path pathLength="1" class="draw draw-late" d="m12 34 9-10 7 6 7-9 13 13" stroke-width="3.5"/>
