<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title">
  <title id="title">Nova, Mindscape tutor</title>
  <defs>
    <radialGradient id="glow"><stop stop-color="#FFD6A8" stop-opacity=".8"/><stop offset="1" stop-color="#FF927D" stop-opacity="0"/></radialGradient>
    <linearGradient id="lantern" x1="18" y1="13" x2="48" y2="53" gradientUnits="userSpaceOnUse"><stop stop-color="#FFC294"/><stop offset=".55" stop-color="#FF927D"/><stop offset="1" stop-color="#9A7BCE"/></linearGradient>
  </defs>
  <circle class="halo" cx="32" cy="32" r="29" fill="url(#glow)"/>
  <g class="lantern">
    <path d="M32 8c-2.6 4.3-5.7 7.2-5.7 11.2a5.7 5.7 0 0 0 11.4 0C37.7 15.2 34.6 12.3 32 8Z" fill="#FFD6A8"/>
    <path d="M20 24.5h24l4 19.2a4 4 0 0 1-3.9 4.8H19.9a4 4 0 0 1-3.9-4.8l4-19.2Z" fill="url(#lantern)"/>
    <path d="M22.5 24.5v-3a9.5 9.5 0 0 1 19 0v3" stroke="#F9D9C5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M25.5 35h.1m12.8 0h.1" stroke="#342C42" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M27 40c1.4 1.6 2.9 2.4 5 2.4s3.6-.8 5-2.4" stroke="#342C42" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M22 51h20" stroke="#F9D9C5" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
  <style>
    .lantern{transform-origin:32px 33px;animation:float 3.2s ease-in-out infinite}
    .halo{transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes breathe{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:.9;transform:scale(1.04)}}
    @media(prefers-reduced-motion:reduce){.lantern,.halo{animation:none}}
  </style>
</svg>
